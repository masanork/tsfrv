name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown --lib -- -D warnings

      - name: Install worker-build
        run: cargo install worker-build@0.8.7 --locked

      - run: npm ci
      - run: worker-build --release --no-panic-recovery

      - name: Smoke-check bundle
        run: test -f build/index.js && test -f build/worker/shim.mjs && test -f build/worker/index.wasm
